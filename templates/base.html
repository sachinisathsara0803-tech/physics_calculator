<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            rgba(2, 8, 25, 0.70),
            rgba(0, 25, 65, 0.35)
        ),
        url("{{ url_for('static', filename='bg3.jpg') }}");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    min-height: 100vh;
}


/* Remove old container spacing */

.gravity_page .container {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px 30px 50px;
}


/* =========================================================
   HOME BUTTON
========================================================= */

.gravity_page > a:first-child {
    position: fixed;
    top: 22px;
    left: 25px;

    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 1000;

    color: #ffffff;
    text-decoration: none;

    background: rgba(5, 25, 65, 0.55);

    border: 1px solid rgba(56, 189, 248, 0.35);

    border-radius: 50%;

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 20px rgba(0, 174, 255, 0.15);

    transition: 0.3s ease;
}

.gravity_page > a:first-child:hover {
    transform: translateY(-2px) scale(1.05);

    background: rgba(0, 150, 255, 0.30);

    box-shadow:
        0 0 25px rgba(0, 174, 255, 0.45);
}

.gravity_page > a:first-child i {
    font-size: 20px !important;
    padding: 0 !important;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    text-align: center;
    padding-top: 55px;
    margin-bottom: 35px;
}

.hero_icon {
    width: 55px;
    height: 55px;

    margin: 0 auto 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00d9ff;

    font-size: 34px;

    text-shadow:
        0 0 15px rgba(0, 217, 255, 0.8);
}

.main_h1 {
    margin: 0 !important;
    padding: 0 !important;

    font-family: Arial, Helvetica, sans-serif !important;

    font-size: clamp(48px, 6vw, 82px) !important;

    line-height: 1.05;

    color: #ffffff !important;

    letter-spacing: -3px;

    text-shadow:
        0 0 30px rgba(0, 160, 255, 0.18);
}

.main_h1 span {
    color: #09bfff;

    text-shadow:
        0 0 25px rgba(0, 191, 255, 0.35);
}

.hero_subtitle {
    margin: 14px 0 0;

    color: #d8eaff;

    font-size: 20px;

    letter-spacing: 0.3px;
}


/* =========================================================
   INTRO CARD
========================================================= */

.intro {

    width: min(100%, 1000px);

    margin: 0 auto 30px;

    padding: 25px 30px;

    display: flex;
    align-items: center;

    gap: 25px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(10, 55, 115, 0.72),
            rgba(12, 35, 80, 0.55)
        );

    border: 1px solid rgba(75, 180, 255, 0.35);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.40),
        inset 0 1px 0 rgba(255,255,255,0.08);
}

.intro_icon {

    min-width: 75px;
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(0, 145, 255, 0.18);

    border: 1px solid rgba(0, 190, 255, 0.25);

    color: #00d9ff;

    font-size: 38px;

    text-shadow:
        0 0 18px rgba(0, 217, 255, 0.7);
}

.intro_text {
    border-left: 2px solid rgba(0, 204, 255, 0.7);

    padding-left: 25px;
}

.intro_text p {
    margin: 0;

    color: #f0f7ff;

    font-size: 16px;

    line-height: 1.7;
}

.intro_more {
    margin-top: 8px !important;
}


/* =========================================================
   CALCULATOR GRID
========================================================= */

.calculator_grid {

    width: min(100%, 1000px);

    margin: 0 auto;

    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 24px;
}


/* =========================================================
   CALCULATOR CARD
========================================================= */

.card {

    padding: 25px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(10, 42, 92, 0.88),
            rgba(4, 18, 43, 0.86)
        );

    border: 1px solid rgba(64, 166, 255, 0.35);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 20px 55px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255,255,255,0.07);

    transition: 0.3s ease;
}

.card:hover {

    transform: translateY(-4px);

    border-color: rgba(0, 195, 255, 0.55);

    box-shadow:
        0 25px 65px rgba(0, 0, 0, 0.5),
        0 0 35px rgba(0, 156, 255, 0.10);
}


/* =========================================================
   HEADING
========================================================= */

.calculator_heading {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;
}

.calculator_heading h2 {

    margin: 0;

    color: #ffffff;

    font-size: 25px;

    font-weight: 700;
}

.calculator_heading h2 span {

    color: #08c7ff;

    text-shadow:
        0 0 15px rgba(0, 200, 255, 0.25);
}

.calculator_title_icon {

    color: #00cfff;

    font-size: 27px;

    text-shadow:
        0 0 15px rgba(0, 207, 255, 0.7);
}

.heading_line {

    width: 55px;

    height: 3px;

    margin: 14px auto 22px;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #0077ff,
            #00e5ff
        );

    box-shadow:
        0 0 12px rgba(0, 200, 255, 0.5);
}


/* =========================================================
   FORM
========================================================= */

.form {

    display: flex;

    flex-direction: column;

    gap: 10px;
}


/* =========================================================
   INPUT
========================================================= */

.input_wrapper {

    height: 58px;

    display: flex;

    align-items: center;

    overflow: hidden;

    border-radius: 15px;

    background:
        rgba(4, 22, 52, 0.82);

    border: 1px solid rgba(75, 158, 230, 0.35);

    transition: 0.25s ease;
}

.input_wrapper:focus-within {

    border-color: #00c8ff;

    box-shadow:
        0 0 18px rgba(0, 190, 255, 0.15);
}

.input_icon {

    width: 55px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #00d9ff;

    font-size: 20px;
}

.input_content {

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.input_content label {

    font-size: 12px;

    color: #d7e8ff;

    font-weight: 600;

    margin-bottom: 2px;
}

.input_content input {

    width: 100%;

    padding: 0;

    margin: 0;

    background: transparent;

    border: none;

    outline: none;

    color: white;

    font-size: 15px;
}

.input_content input::placeholder {

    color: #8296b5;
}

.input_content input:focus {

    box-shadow: none;
}

.unit {

    min-width: 60px;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(25, 70, 120, 0.65);

    color: #e5f6ff;

    font-weight: bold;
}


/* =========================================================
   CALCULATE BUTTON
========================================================= */

.calculate_btn {

    width: 100%;

    height: 54px;

    margin-top: 8px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    color: white;

    font-size: 16px;

    font-weight: 700;

    background:
        linear-gradient(
            100deg,
            #078cff,
            #08d7e8
        );

    box-shadow:
        0 8px 25px rgba(0, 157, 255, 0.30);

    transition: 0.3s ease;
}

.calculate_btn:hover {

    transform: translateY(-2px);

    background:
        linear-gradient(
            100deg,
            #00a2ff,
            #00e5ed
        );

    box-shadow:
        0 10px 35px rgba(0, 205, 255, 0.45);
}

.calculate_btn i:last-child {

    transition: 0.25s ease;
}

.calculate_btn:hover i:last-child {

    transform: translateX(5px);
}


/* =========================================================
   RESULT
========================================================= */

.result_box {

    min-height: 75px;

    margin-top: 15px;

    padding: 13px 18px;

    display: flex;

    align-items: center;

    gap: 15px;

    border-radius: 15px;

    background:
        rgba(4, 35, 82, 0.85);

    border: 1px solid rgba(0, 176, 255, 0.25);
}

.result_icon {

    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #00d9ff;

    background:
        rgba(0, 190, 255, 0.12);

    font-size: 22px;
}

.result_content {

    display: flex;

    flex-direction: column;

    gap: 4px;
}

.result_content span {

    color: #00cfff;

    font-size: 13px;

    font-weight: 600;
}

.result_content strong {

    color: white;

    font-size: 18px;
}

.empty_result .result_content strong {

    color: #91a6c5;
}


/* =========================================================
   ERROR
========================================================= */

.error_box {

    margin-top: 12px;

    padding: 12px 15px;

    display: flex;

    align-items: center;

    gap: 10px;

    border-radius: 12px;

    color: #ffb3b3;

    background:
        rgba(255, 40, 40, 0.10);

    border: 1px solid rgba(255, 70, 70, 0.25);

    font-size: 14px;
}

.error_box i {

    color: #ff5555;
}


/* =========================================================
   MORE INFO
========================================================= */

.toggle_btn {

    width: 100%;

    margin-top: 13px;

    padding: 11px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    border: 1px solid rgba(70, 160, 230, 0.35);

    border-radius: 12px;

    background:
        rgba(15, 48, 85, 0.75);

    color: #d9f5ff;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.25s ease;
}

.toggle_btn:hover {

    background:
        rgba(0, 150, 220, 0.25);

    border-color: #00c8ff;

    color: #ffffff;
}


/* =========================================================
   FORMULA CONTENT
========================================================= */

.content {

    display: none;

    margin-top: 12px;

    padding: 22px;

    width: 100%;

    height: auto;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(230, 245, 255, 0.96),
            rgba(195, 225, 245, 0.94)
        );

    color: #102542;

    border: 1px solid rgba(130, 205, 255, 0.5);

    animation: infoOpen 0.3s ease;
}

.content.show {

    display: block;
}

@keyframes infoOpen {

    from {
        opacity: 0;
        transform: translateY(-5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.formula_title {

    text-align: center;

    color: #0866a5;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 12px;
}

.formula {

    text-align: center;

    color: #071c3b;

    font-size: 25px;

    padding: 10px;
}

.formula_cont {

    color: #1c3554;

    font-family: Arial, sans-serif;

    font-size: 13px;

    line-height: 1.6;

    text-align: left;
}

.formula_cont p {

    margin: 8px 0;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    width: min(100%, 600px);

    margin: 35px auto 0;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    color: #c7d9ed;

    font-size: 13px;
}

.footer span {

    flex: 1;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0, 210, 255, 0.8)
        );
}

.footer span:last_child {

    background:
        linear-gradient(
            90deg,
            rgba(0, 210, 255, 0.8),
            transparent
        );
}

.footer i {

    color: #00d9ff;

    font-size: 16px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .calculator_grid {

        grid-template-columns: 1fr;

        max-width: 600px;
    }

    .intro {

        max-width: 600px;
    }
}


@media (max-width: 600px) {

    .page .container {

        padding: 20px 15px 35px;
    }

    .hero {

        padding-top: 55px;
    }

    .main_h1 {

        font-size: 43px !important;

        letter-spacing: -2px;
    }

    .hero-subtitle {

        font-size: 15px;

        line-height: 1.5;
    }

    .intro {

        padding: 18px;

        flex-direction: column;

        text-align: center;

        gap: 15px;
    }

    .intro_icon {

        min-width: 60px;
        width: 60px;
        height: 60px;

        font-size: 28px;
    }

    .intro_text {

        border-left: none;

        border-top: 2px solid rgba(0, 204, 255, 0.7);

        padding-left: 0;
        padding-top: 15px;
    }

    .intro_text p {

        font-size: 13px;

        line-height: 1.6;
    }

    .intro_more {

        display: none;
    }

    .card {

        padding: 18px;

        border-radius: 20px;
    }

    .calculator_heading h2 {

        font-size: 19px;
    }

    .calculator_title_icon {

        font-size: 22px;
    }

    .input_wrapper {

        height: 56px;
    }

    .input_icon {

        width: 45px;
    }

    .unit {

        min-width: 50px;
    }

    .footer {

        gap: 7px;

        font-size: 11px;
    }

    .page > a:first-child {

        width: 40px;
        height: 40px;

        top: 15px;
        left: 15px;
    }
}
    </style>

    
</head>
<body class="{{ body_class|default('') }}">

    
        <a href="{{ url_for('home') }}"><i class="fa fa-home" style="font-size:30px; color:white; padding:20px;"></i></a>
    

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
