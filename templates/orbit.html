{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Orbital Velocity Calculator</h2>
    <form action="/orbit" method="POST">
        <input type="number" step="any" name="Radius" required placeholder="Radius(m)">
        
        <button type="submit">Calculate Velocity</button>
    </form>

    {% if result is not none %}
    <div class="result-box">
        Force: {{ "%.4e"|format(result) }} N
    </div>
    {% endif %}
</div>
{% endblock %}
